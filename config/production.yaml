app:
  name: "nexalens"
  env: "production"
  log_level: "INFO"

database:
  postgres_user: "${POSTGRES_USER}"
  postgres_password: "${POSTGRES_PASSWORD}"
  postgres_db: "${POSTGRES_DB}"
  database_pool_size: 20
  database_max_overflow: 30
  postgres_readonly_user: "${POSTGRES_READONLY_USER}"
  postgres_readonly_password: "${POSTGRES_READONLY_PASSWORD}"

redis:
  url: "redis://redis:6379/0"

chroma:
  host: "chroma"
  port: 8000
  collection: "nexalens_docs"

ollama:
  host: "http://ollama:11434"
  llm_model: "llama3.1:8b"
  llm_embedding_model: "nomic-embed-text"
  llm_temperature: 0.1
  llm_max_tokens: 4096

sql:
  dialect: "postgresql"
  max_rows: 1000
  timeout: 30
  max_query_cost: 10000.0

documents:
  chunk_size: 1000
  chunk_overlap: 200
  max_doc_size_mb: 50
  supported_extensions: [".pdf", ".txt", ".md", ".csv", ".xlsx", ".docx"]

api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  cors_origins: ["https://app.nexalens.com", "https://dashboard.nexalens.com"]

security:
  secret_key: "${SECRET_KEY}"
  access_token_expire_minutes: 60
  refresh_token_expire_days: 7

metrics:
  enable_metrics: true
  metrics_port: 9090

rag:
  quality:
    chunking_strategy: "recursive"
    top_k: 20
    rerank_top_k: 10
    rerank_enabled: true
    rerank_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    min_score_threshold: 0.3
    dedup_threshold: 0.9
    dedup_enabled: true
    require_citations: true
    max_citations_per_answer: 5
    confidence_threshold: 0.5