[project]
name = "nexalens"
version = "0.1.0"
description = "LLM-powered business analytics platform with hybrid RAG (SQL + Documents)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy==2.0.34",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.10",
    "redis==5.1.0",
    "chromadb>=0.5.0,<0.6.0",
    "langchain-core>=0.3.26,<0.4.0",
    "langchain-community>=0.3.14,<0.4.0",
    "langchain-text-splitters==0.3.5",
    "sentence-transformers==3.2.0",
    "ollama==0.4.2",
    "pandas==2.2.3",
    "numpy>=1.22,<2.0",
    "python-dotenv==1.0.1",
    "httpx==0.27.2",
    "tenacity==8.5.0",
    "structlog==24.4.0",
    "prometheus-client==0.20.0",
    "numpy-financial==1.0.0",
    "openpyxl==3.1.5",
    "apscheduler==3.10.4",
    "jinja2==3.1.4",
    "aiofiles==24.1.0",
    "statsmodels==0.14.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.8",
    "pytest-cov==6.0.0",
    "ruff==0.7.3",
    "mypy==1.13.0",
    "pre-commit==3.8.0",
    "httpx==0.27.2",
    "pytest-mock==3.14.0",
    "faker==33.1.0",
]
ui = [
    "streamlit==1.39.0",
    "plotly==5.24.1",
    "altair==5.5.0",
]
analytics = [
    "weasyprint==62.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "T20", "PTH", "ERA", "RET", "SIM", "TCH"]
ignore = ["ANN101", "ANN102", "T201", "T203", "PTH118", "PTH123"]
fixable = ["F", "I", "UP", "W", "C90", "SIM", "TCH"]
unfixable = ["ANN", "ERA", "RET", "T20", "PTH", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"